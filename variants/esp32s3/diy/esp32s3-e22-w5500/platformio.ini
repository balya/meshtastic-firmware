[env:esp32s3-e22-w5500-inkhud-e370-oled]
extends = esp32s3-e22-w5500-inkhud-e370
build_unflags =
  ${esp32s3-e22-w5500-inkhud_base.build_unflags}
  -D MESHTASTIC_EXCLUDE_SCREEN
  -D MESHTASTIC_EXCLUDE_INPUTBROKER
  -D HAS_BUTTON=0
build_src_filter =
  ${esp32s3-e22-w5500-inkhud_base.build_src_filter}
  +<graphics/draw/>
  +<graphics/fonts/>
  +<graphics/EmoteRenderer.cpp>
  +<graphics/emotes.cpp>
  +<graphics/ScreenGlobals.cpp>
  +<graphics/SharedUIDisplay.cpp>
  +<graphics/TFTColorRegions.cpp>
  +<graphics/TimeFormatters.cpp>
  +<graphics/VirtualKeyboard.cpp>
build_flags =
  ${esp32s3-e22-w5500-inkhud-e370.build_flags}
  -UMESHTASTIC_EXCLUDE_SCREEN
  -UMESHTASTIC_EXCLUDE_INPUTBROKER
  -UHAS_BUTTON
  -DHAS_BUTTON=1
  -DE22_W5500_NO_BASEUI_BUTTON_PIN
  -DUSERPREFS_BUTTON_PIN=0
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -D OLED_RU=1
