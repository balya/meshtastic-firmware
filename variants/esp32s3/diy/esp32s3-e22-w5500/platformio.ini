[env:esp32s3-e22-w5500]
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_level = extra
board_check = true
board_build.partitions = default_16MB.csv
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi

build_unflags =
  ${esp32s3_base.build_unflags}
  -D LED_BUILTIN=-1

build_flags =
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -D BOARD_HAS_PSRAM
  -D MESHTASTIC_EXCLUDE_BLUETOOTH=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -D MESHTASTIC_TCP_API_MAX_CLIENTS=4
  -D MESHTASTIC_TCP_API_IDLE_TIMEOUT_MS=120000
  -D HAS_UDP_MULTICAST=1
  -D MAX_NUM_NODES=200
  -D MAX_SATELLITE_NODES=120
  -D OLED_RU=1
  -D CONFIG_MDNS_MAX_INTERFACES=3
  -D CONFIG_LITTLEFS_PAGE_SIZE=256
  -I"${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/espressif__mdns/include"
  -I"${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/joltwallet__littlefs/include"
  -I variants/esp32s3/diy/esp32s3-e22-w5500

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  CONFIG_ETH_ENABLED=y
  CONFIG_ARDUINO_SELECTIVE_Ethernet=y
  CONFIG_MDNS_MAX_INTERFACES=3
  CONFIG_LITTLEFS_PAGE_SIZE=256

[env:esp32s3-e22-w5500-inkhud]
extends = esp32s3_base, inkhud
board = esp32-s3-devkitc-1
board_level = extra
board_check = true
board_build.partitions = default_16MB.csv
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
custom_meshtastic_has_ink_hud = true

build_unflags =
  ${esp32s3_base.build_unflags}
  -D LED_BUILTIN=-1

build_src_filter =
  ${esp32s3_base.build_src_filter}
  ${inkhud.build_src_filter}

build_flags =
  ${esp32s3_base.build_flags}
  ${inkhud.build_flags}
  -D PRIVATE_HW
  -D BOARD_HAS_PSRAM
  -D MESHTASTIC_EXCLUDE_BLUETOOTH=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -D MESHTASTIC_TCP_API_MAX_CLIENTS=4
  -D MESHTASTIC_TCP_API_IDLE_TIMEOUT_MS=120000
  -D HAS_UDP_MULTICAST=1
  -D MAX_NUM_NODES=200
  -D MAX_SATELLITE_NODES=120
  -D CONFIG_MDNS_MAX_INTERFACES=3
  -D CONFIG_LITTLEFS_PAGE_SIZE=256
  -I"${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/espressif__mdns/include"
  -I"${platformio.packages_dir}/framework-arduinoespressif32-libs/esp32s3/include/joltwallet__littlefs/include"
  -I variants/esp32s3/diy/esp32s3-e22-w5500

lib_deps =
  ${inkhud.lib_deps}
  ${esp32s3_base.lib_deps}

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  CONFIG_ETH_ENABLED=y
  CONFIG_ARDUINO_SELECTIVE_Ethernet=y
  CONFIG_MDNS_MAX_INTERFACES=3
  CONFIG_LITTLEFS_PAGE_SIZE=256
